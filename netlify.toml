[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router uses client-side routing - without this, refreshing on a
# path like /client/rewards 404s because Netlify would otherwise look for
# a literal file at that path instead of letting index.html + the router
# handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
